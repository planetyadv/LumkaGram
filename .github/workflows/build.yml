name: Build LumkaGram APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk/*
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          df -h

      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install required NDK 27.2.12479018 & SDK 36
        run: |
          yes | sdkmanager --install "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ndk.dir=$ANDROID_HOME/ndk/27.2.12479018" >> local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Inject Secrets into BuildVars.java & Google Services
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          BUILD_VARS="TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          if [ -n "$API_ID" ] && [ -n "$API_HASH" ]; then
            echo "Injecting custom API_ID and API_HASH..."
            sed -i "s/public static int APP_ID = .*/public static int APP_ID = $API_ID;/g" "$BUILD_VARS"
            sed -i "s/public static String APP_HASH = .*/public static String APP_HASH = \"$API_HASH\";/g" "$BUILD_VARS"
          else
            echo "Warning: API_ID or API_HASH secrets not provided! Using repository defaults."
          fi

          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Injecting custom google-services.json..."
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > TMessagesProj/google-services.json
          fi

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release.keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > TMessagesProj/config/release.keystore
          fi

      - name: Build with Gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          export GRADLE_OPTS="-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dorg.gradle.daemon=false"
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            ./gradlew assembleAfatRelease -PkeystorePassword="$KEYSTORE_PASSWORD" -PkeyAlias="$KEY_ALIAS" -PkeyPassword="$KEY_PASSWORD"
          else
            ./gradlew assembleAfatDebug
          fi

      - name: Locate and prepare APK
        id: prepare_apk
        run: |
          mkdir -p output_apks
          find TMessagesProj/build/outputs/apk/ -name "*.apk" -exec cp {} output_apks/ \;
          ls -la output_apks/

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LumkaGram-APK
          path: output_apks/*.apk
          retention-days: 14

      - name: Publish to GitHub Releases (Tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output_apks/*.apk
          generate_release_notes: true
